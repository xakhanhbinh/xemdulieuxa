function draw(){const key=$('search').value.toLowerCase();const filtered=rows.filter(row=>Object.values(row).some(v=>String(v??'').toLowerCase().includes(key)));const pages=Math.max(1,Math.ceil(filtered.length/50));page=Math.max(1,Math.min(page,pages));$('head').replaceChildren();const header=document.createElement('tr');fields.forEach(f=>header.append(textNode('th',f.fullLabel||f.label)));$('head').append(header);$('body').replaceChildren();filtered.slice((page-1)*50,page*50).forEach(row=>{const tr=document.createElement('tr');fields.forEach(f=>tr.append(textNode('td',row[f.id]??'')));$('body').append(tr)});$('page').textContent=`Trang ${page}/${pages} • ${filtered.length} dòng`;$('prev').disabled=page===1;$('next').disabled=page===pages}
async function load(){const version=++loadVersion;rows=[];fields=[];draw();syncUnit();$('rowCount').textContent='—';$('status').textContent='Đang tải dữ liệu';try{const unit=UNITS.find(u=>u.id===$('unit').value);if(!unit.url)throw Error('Chưa có link ngành.');const read=async action=>{const r=await fetch(unit.url+'?action='+action);if(!r.ok)throw Error('Kết nối lỗi HTTP '+r.status);return r.json()};const [data,schema]=await Promise.all([read('getData'),read('getSchema').catch(()=>({}))]);if(!Array.isArray(data))throw Error(data.message||'Không đọc được dữ liệu');if(version!==loadVersion)return;fields=(schema.fields||schema.groups?.flatMap(g=>g.fields)||unit.fallback.flatMap(g=>g.fields)).map((f,i)=>({...f,id:f.id||f.key||'c'+(i+1)}));if(!fields.length&&data.length)fields=Object.keys(data[0]).filter(k=>/^c\d+$/.test(k)).sort((a,b)=>Number(a.slice(1))-Number(b.slice(1))).map(k=>({id:k,label:'Cột '+k.slice(1)}));rows=data;page=1;draw();$('rowCount').textContent=rows.length.toLocaleString('vi-VN');$('status').textContent='Đã tải '+rows.length+' dòng dữ liệu'}catch(error){if(version===loadVersion)$('status').textContent=error.message}}
function syncUnit(){const unit=UNITS.find(u=>u.id===$('unit').value);$('unitHeading').textContent=unit?.name||'Dữ liệu cơ quan, đơn vị';document.querySelectorAll('.unit-card').forEach(button=>{const active=button.dataset.unit===$('unit').value;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))})}
const navCategories=[
 {name:'CƠ QUAN ĐẢNG, CHÍNH QUYỀN',ids:['ubkt','xaydungdang','phongkinhte','phongvanhoa','pvhcc','congich']},
 {name:'LỰC LƯỢNG',ids:['congan','quansu']},
 {name:'MẶT TRẬN, ĐOÀN THỂ VÀ HỘI',ids:['mttq','doanthanhnien','nongdan','phunu','cuuchienbinh','nguoicaotuoi','chuthapdo','khuyenhoc','nannhan_cddc']}
];
const iconPaths={
 ubkt:'M12 3 3 7v6c0 4 9 8 9 8s9-4 9-8V7l-9-4z M8 12l3 3 5-6',
 xaydungdang:'M12 3v6M4 15v6m8-6v6m8-6v6M4 15V9h16v6',
 phongkinhte:'M3 20h18M5 16l5-5 4 3 6-9',
 phongvanhoa:'M3 9h18M5 9v10m7-10v10m7-10v10M3 21h18M3 9l9-6 9 6',
 pvhcc:'M4 21V6h16v15M8 10h2m4 0h2M8 14h2m4 0h2M10 21v-4h4v4',

 congan:'M12 3 3 7v6c0 4 9 8 9 8s9-4 9-8V7l-9-4z',
 quansu:'m12 3 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z',
 mttq:'M6 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm12 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 21v-5c0-4 8-4 8 0v5m4 0v-5c0-4 8-4 8 0v5',
 nongdan:'M12 21V10M12 13C4 13 3 8 3 4c8 0 9 5 9 9zm0-3c0-6 5-7 9-7 0 5-3 7-9 7',
 phunu:'M12 14a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM12 14v8M8 19h8',
 cuuchienbinh:'M6 3l3 8m9-8-3 8M12 21a5 5 0 1 0 0-10 5 5 0 0 0 0 10z',
 nguoicaotuoi:'M13 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM11 9l-2 5 3 2-2 6m2-6 4 6M11 9l5 5h3v8',
 chuthapdo:'M9 3h6v6h6v6h-6v6H9v-6H3V9h6z',
 khuyenhoc:'m2 9 10-5 10 5-10 5zM6 11v7c4 3 8 3 12 0v-7M22 9v9',
 nannhan_cddc:'M12 20S2 14 2 8c0-6 8-7 10-1 2-6 10-5 10 1 0 6-10 12-10 12z',
 doanthanhnien:'M12 2c2 6 8 7 8 13a8 8 0 0 1-16 0c0-4 3-6 5-8-1 5 3 6 3-5z'
};
for(const category of navCategories){const heading=textNode('div',category.name);heading.className='nav-group';heading.dataset.category=category.name;$('unitNav').append(heading);for(const id of category.ids){const unit=UNITS.find(u=>u.id===id);if(!unit)continue;const button=textNode('button','');button.type='button';button.className='unit-card';button.dataset.unit=unit.id;button.dataset.category=category.name;button.title=unit.name;button.setAttribute('aria-label',unit.name);const icon=textNode('span','');icon.className='unit-icon';icon.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+iconPaths[id]+'"/></svg>';const name=textNode('span',unit.name);name.className='unit-name';button.append(icon,name);button.onclick=()=>{$('unit').value=unit.id;$('search').value='';load()};$('unitNav').append(button)}}
function navKey(value){return value.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase()}
$('navSearch').oninput=()=>{const key=navKey($('navSearch').value);let count=0;document.querySelectorAll('.unit-card').forEach(button=>{button.hidden=!navKey(button.title).includes(key);if(!button.hidden)count++});document.querySelectorAll('.nav-group').forEach(group=>{group.hidden=![...document.querySelectorAll('.unit-card')].some(button=>button.dataset.category===group.dataset.category&&!button.hidden)});$('navEmpty').hidden=count>0};
$('collapseNav').onclick=()=>{const collapsed=document.querySelector('.shell').classList.toggle('nav-collapsed');$('collapseNav').textContent=collapsed?'›':'‹';$('collapseNav').setAttribute('aria-expanded',String(!collapsed));$('collapseNav').setAttribute('aria-label',collapsed?'Mở rộng thanh bên':'Thu gọn thanh bên')};
UNITS.forEach(unit=>{const option=textNode('option',unit.name);option.value=unit.id;$('unit').append(option)});$('unit').onchange=load;$('reload').onclick=load;$('search').oninput=()=>{page=1;draw()};$('prev').onclick=()=>{page--;draw()};$('next').onclick=()=>{page++;draw()};load();
</script></html>
